[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "katana-cosplice"
version = "2.2.0"
description = "Pure-Python count-debiased ExcessBioVar signed TOM co-splicing network and module discovery."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Tara Maharjan"}]
requires-python = ">=3.10"
keywords = ["splicing", "co-splicing", "WGCNA", "TOM", "bicor", "RNA-seq", "bioinformatics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "dynamicTreeCut>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/Taratype0/katana-cosplice"
Repository = "https://github.com/Taratype0/katana-cosplice"
Issues = "https://github.com/Taratype0/katana-cosplice/issues"
Suite = "https://github.com/Taratype0/Katana-splicing-tool"

[project.scripts]
katana-cosplice = "katana_cosplice.cli:main"
cosplice = "katana_cosplice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
